<div class="relative flex flex-col bg-transparent px-2 pb-2 pt-1 md:pb-2 mobile-input-fix">
  <!-- Attachment Menu -->
  <div *ngIf="showAttachmentMenu()" class="absolute bottom-[75px] left-4 bg-white dark:bg-[#233138] shadow-2xl rounded-2xl p-4 flex flex-col space-y-4 w-52 animate-in slide-in-from-bottom-4 duration-200 z-50 border border-[#e9edef] dark:border-[#374248]">
    <label class="flex items-center space-x-4 cursor-pointer hover:bg-[#f0f2f5] dark:hover:bg-[#182229] p-2.5 rounded-xl transition-colors">
      <div class="w-12 h-12 bg-[#7f66ff] rounded-full flex items-center justify-center text-white shadow-sm">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      </div>
      <span class="text-[15px] font-medium text-[#111b21] dark:text-[#e9edef]">Document</span>
      <input type="file" (change)="onFileSelected($event, 'Document')" class="hidden">
    </label>
    
    <label class="flex items-center space-x-4 cursor-pointer hover:bg-[#f0f2f5] dark:hover:bg-[#182229] p-2.5 rounded-xl transition-colors">
      <div class="w-12 h-12 bg-[#007bfc] rounded-full flex items-center justify-center text-white shadow-sm">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </div>
      <span class="text-[15px] font-medium text-[#111b21] dark:text-[#e9edef]">Gallery</span>
      <input type="file" accept="image/*,video/*" (change)="onFileSelected($event, 'Gallery Media')" class="hidden">
    </label>
  </div>

  <!-- Message Input Area (Exact Screenshot 1 Style) -->
  <form (ngSubmit)="send()" class="flex items-center space-x-2">
    <div class="flex-1 bg-white dark:bg-[#2a3942] rounded-[25px] px-3 py-1 flex items-center shadow-md border border-[#e9edef] dark:border-none">
      <!-- Emoji Icon -->
      <button type="button" class="p-2 text-[#667781] dark:text-[#8696a0] hover:text-[#111b21] dark:hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5s.67 1.5 1.5 1.5zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
      </button>

      <input 
        type="text" 
        name="message" 
        [(ngModel)]="message" 
        (input)="onTyping()"
        placeholder="Message" 
        class="flex-1 bg-transparent border-none focus:outline-none text-[17px] text-[#111b21] dark:text-[#e9edef] py-2.5 px-1 placeholder:text-[#667781] dark:placeholder:text-[#8696a0]"
        autocomplete="off"
        (focus)="showAttachmentMenu.set(false)"
      >

      <div class="flex items-center space-x-1 pr-1">
        <!-- Attachment Icon -->
        <button type="button" (click)="toggleAttachments()" class="p-2 text-[#667781] dark:text-[#8696a0] hover:text-[#111b21] dark:hover:text-white transition-colors" [class.rotate-45]="showAttachmentMenu()">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.31 2.69 6 6 6s6-2.69 6-6V6h-1.5z"/></svg>
        </button>

        <!-- Rupee Icon (WhatsApp Pay) -->
        <button type="button" (click)="pay()" class="p-2 text-[#667781] dark:text-[#8696a0] hover:text-[#111b21] dark:hover:text-white transition-colors" *ngIf="!message.trim()">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M13.66 7c-.51-.66-1.31-1-2.16-1H8V4h8V2H5v2h1v2H5v2h1v2H5v2h1v2H5v2h11v-2h-5.34c.85 0 1.65-.34 2.16-1 .51-.66.84-1.51.84-2.5s-.33-1.84-.84-2.5z"/></svg>
        </button>

        <!-- Camera Icon -->
        <label class="p-2 text-[#667781] dark:text-[#8696a0] hover:text-[#111b21] dark:hover:text-white transition-colors cursor-pointer" *ngIf="!message.trim()">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <input type="file" accept="image/*" capture="environment" (change)="onFileSelected($event, 'Camera Image')" class="hidden">
        </label>
      </div>
    </div>
    
    <!-- Circular Send/Voice Button - Always visible on mobile -->
    <button 
      type="submit" 
      class="w-[50px] h-[50px] bg-[#00a884] rounded-full flex items-center justify-center text-white shadow-lg active:scale-90 transition-all flex-shrink-0 md:w-[50px] md:h-[50px]"
      [attr.disabled]="!message.trim()"
    >
      <svg *ngIf="message.trim()" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
      <svg *ngIf="!message.trim()" (click)="$event.preventDefault(); voiceCall()" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
  </form>
</div>
