<div class="flex flex-col bg-white dark:bg-[#111b21] h-full">
  <!-- Archived Section -->
  <div class="px-4 py-4 flex items-center justify-between cursor-pointer hover:bg-[#f5f6f6] transition-colors group">
    <div class="flex items-center space-x-6">
      <div class="w-6 h-6 text-[#00a884] flex items-center justify-center">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M20.548 3.489c-.662-.12-1.392-.25-2.187-.355C16.507 2.89 14.316 2.75 12 2.75s-4.507.14-6.361.384c-.795.105-1.525.235-2.187.355C2.547 3.654 2 4.402 2 5.274V6.5c0 .828.672 1.5 1.5 1.5h17c.828 0 1.5-.672 1.5-1.5V5.274c0-.872-.547-1.62-1.452-1.785zM3.5 9.5c-.828 0-1.5.672-1.5 1.5v7.726c0 1.38 1.03 2.532 2.405 2.651 1.854.16 4.045.273 6.345.273s4.49-.113 6.345-.273c1.375-.119 2.405-1.271 2.405-2.651V11c0-.828-.672-1.5-1.5-1.5h-14.5zm8.5 6.5c-1.381 0-2.5-1.119-2.5-2.5s1.119-2.5 2.5-2.5 2.5 1.119 2.5 2.5-1.119 2.5-2.5 2.5z"/></svg>
      </div>
      <span class="font-bold text-[17px] text-[#111b21]">Archived</span>
    </div>
    <span class="text-[12px] font-bold text-[#00a884]">1</span>
  </div>

  <!-- Empty State -->
  <div *ngIf="users().length === 0" class="flex flex-col items-center justify-center p-10 text-center space-y-4">
    <div class="w-20 h-20 bg-[#f0f2f5] dark:bg-[#202c33] rounded-full flex items-center justify-center text-[#8696a0]">
      <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </div>
    <p class="text-[#111b21] dark:text-[#e9edef] text-sm font-medium">No contacts found</p>
    <p class="text-[#667781] dark:text-[#8696a0] text-xs px-6">Register from another device to see contacts here.</p>
  </div>

  <!-- Users List -->
  <div *ngFor="let user of users()" 
       (click)="userClick.emit(user)"
       class="px-4 py-3 hover:bg-[#f5f6f6] cursor-pointer flex items-center space-x-4 bg-white transition-colors border-none group relative">
    
    <!-- Profile Pic -->
    <div class="relative flex-shrink-0">
      <img [src]="user.profilePic || 'https://abs.twimg.com/sticky/default_profile_images/default_profile_400x400.png'" 
           class="w-[55px] h-[55px] rounded-full object-cover shadow-sm">
      <div *ngIf="user.isOnline" class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-[#1fa855] border-2 border-white rounded-full"></div>
    </div>

    <!-- Content -->
    <div class="flex-1 min-w-0 border-b border-[#f2f2f2] pb-4 pt-1">
      <div class="flex items-center justify-between mb-0.5">
        <h4 class="font-bold text-[#111b21] truncate text-[17px] tracking-tight leading-none">{{ user.name }}</h4>
        <span class="text-[12px] text-[#667781] font-medium">{{ user.lastMessageTime || 'Yesterday' }}</span>
      </div>
      
      <div class="flex items-center justify-between">
        <div class="flex items-center min-w-0 flex-1 mr-2">
          <!-- Blue Ticks -->
          <svg *ngIf="user.lastMessageStatus === 'read' || !user.lastMessageStatus" class="w-4 h-4 text-[#53bdeb] mr-1 flex-shrink-0" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.547a.5.5 0 0 1 .708 0z"/>
            <path d="M10.354 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l3.146-3.147a.5.5 0 0 1 .708 0z"/>
          </svg>
          <p class="text-[14px] text-[#667781] truncate leading-tight">{{ user.about || 'Available' }}</p>
        </div>
        
        <!-- Pin Icon -->
        <svg *ngIf="user.isPinned || user.phone === '7348012628'" class="w-4 h-4 text-[#8696a0] -rotate-45" fill="currentColor" viewBox="0 0 24 24"><path d="M16 9V4l1 0V2H7v2l1 0v5l-2 2v2h5v7l1 1 1-1v-7h5v-2l-2-2z"/></svg>
      </div>
    </div>
  </div>
</div>
