<div class="fixed inset-0 bg-[#0b141a] flex flex-col z-[100] animate-in slide-in-from-right duration-300">
  <!-- Profile Header (Image 4 style) -->
  <div class="bg-[#202c33] text-[#e9edef] p-4 flex items-center space-x-6 shadow-md">
    <button (click)="close.emit()" class="p-1 hover:bg-white hover:bg-opacity-10 rounded-full">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <h2 class="text-xl font-bold">Profile</h2>
  </div>

  <div class="flex-1 overflow-y-auto bg-[#0b141a]">
    <!-- Profile Photo (Image 4 style) -->
    <div class="flex flex-col items-center py-8">
      <div class="relative group w-52 h-52 rounded-full overflow-hidden shadow-2xl border-4 border-transparent hover:border-[#00a884] transition-all">
        <img [src]="profilePic || 'https://abs.twimg.com/sticky/default_profile_images/default_profile_400x400.png'" class="w-full h-full object-cover">
        <div (click)="fileInput.click()" class="absolute inset-0 bg-black bg-opacity-40 flex flex-col items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
          <svg class="w-10 h-10 mb-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm-9 3c0 4.97 4.03 9 9 9s9-4.03 9-9-4.03-9-9-9-9 4.03-9 9zm11.5 6h-5c-.28 0-.5-.22-.5-.5s.22-.5.5-.5h5c.28 0 .5.22.5.5s-.22.5-.5.5z"/></svg>
          <span class="text-xs font-bold uppercase tracking-wider">Change Photo</span>
        </div>
        <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden">
      </div>
      <button (click)="fileInput.click()" class="mt-4 text-[#00a884] font-semibold text-sm hover:underline">Edit</button>
    </div>

    <!-- Info Sections (Image 4 style) -->
    <div class="px-6 space-y-8 max-w-2xl mx-auto">
      <!-- Name -->
      <div class="flex items-start space-x-6">
        <div class="pt-1 text-[#8696a0]">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="flex-1 border-b border-[#222d34] pb-4">
          <label class="text-[#8696a0] text-sm">Name</label>
          <div class="flex items-center justify-between mt-1">
            <input type="text" [(ngModel)]="name" class="bg-transparent text-[#e9edef] text-[17px] focus:outline-none w-full font-medium">
            <svg class="w-5 h-5 text-[#00a884]" fill="currentColor" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          </div>
          <p class="text-[13px] text-[#8696a0] mt-3 leading-tight">This is not your username or pin. This name will be visible to your WhatsApp contacts.</p>
        </div>
      </div>

      <!-- About -->
      <div class="flex items-start space-x-6">
        <div class="pt-1 text-[#8696a0]">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
        </div>
        <div class="flex-1 border-b border-[#222d34] pb-4">
          <label class="text-[#8696a0] text-sm">About</label>
          <div class="flex items-center justify-between mt-1">
            <input type="text" [(ngModel)]="about" class="bg-transparent text-[#e9edef] text-[17px] focus:outline-none w-full font-medium">
            <svg class="w-5 h-5 text-[#00a884]" fill="currentColor" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          </div>
        </div>
      </div>

      <!-- Phone -->
      <div class="flex items-start space-x-6">
        <div class="pt-1 text-[#8696a0]">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </div>
        <div class="flex-1 pb-4">
          <label class="text-[#8696a0] text-sm">Phone</label>
          <div class="text-[#e9edef] text-[17px] mt-1 font-medium">{{ user?.phone }}</div>
        </div>
      </div>

      <!-- Success Message -->
      <div *ngIf="showSuccess()" class="bg-[#00a884] bg-opacity-10 text-[#00a884] p-3 rounded-lg text-center font-medium animate-pulse">
        Profile updated successfully!
      </div>

      <!-- Save Button -->
      <div class="pt-4">
        <button (click)="onUpdate()" [disabled]="loading" class="w-full bg-[#00a884] text-[#0b141a] py-3 rounded-full font-bold shadow-lg hover:bg-[#008f72] transition-all disabled:opacity-50 flex items-center justify-center space-x-2">
          <svg *ngIf="loading" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ loading ? 'Saving...' : 'Save Changes' }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
